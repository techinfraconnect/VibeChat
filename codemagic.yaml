workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter Dependencies
        script: |
          flutter pub get
      - name: Build Unsigned iOS App & Package IPA
        script: |
          cd admin_chat
          flutter build ios --no-codesign --release
          cd ios
          mkdir -p Payload
          cd Payload
          ln -s ../build/ios/iphoneos/Runner.app Runner.app
          cd ..
          zip -r AdminChat.ipa Payload
          cp AdminChat.ipa ../../
    artifacts:
      - AdminChat.ipa
      - admin_chat/*.ipa