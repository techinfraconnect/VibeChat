workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Dependencies
        script: |
          cd admin_chat
          flutter pub get
      - name: Raw Apple Compiler Override & Package IPA
        script: |
          cd admin_chat/ios
          
          # 1. Bypass Flutter CLI and run the raw Apple compiler.
          # Command-line flags have the highest precedence and will force-disable signing on ALL plugins (Firebase, etc).
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
            
          # 2. Navigate back to project root and create Payload folder
          cd ..
          mkdir -p Payload
          
          # 3. Dynamically find the built Runner.app (xcodebuild paths can vary slightly)
          APP_DIR=$(find . -name "Runner.app" -type d | head -n 1)
          
          if [ -n "$APP_DIR" ]; then
            echo "Success: Unsigned app found at $APP_DIR"
            cp -r "$APP_DIR" Payload/
            zip -r AdminChat.ipa Payload
            cp AdminChat.ipa ../
          else
            echo "Error: Runner.app still not found! Build failed."
            exit 1
          fi
    artifacts:
      - AdminChat.ipa