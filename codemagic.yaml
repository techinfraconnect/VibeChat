workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Build Unsigned iOS App & Package IPA
        script: |
          cd admin_chat
          
          # Force Xcode to skip code signing
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> ios/Flutter/Generated.xcconfig
          
          # Build the app without codesign
          flutter build ios --release --no-codesign
          
          # Check if the build succeeded and package it
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            mkdir -p Payload
            cp -r build/ios/iphoneos/Runner.app Payload/
            zip -r AdminChat.ipa Payload
            cp AdminChat.ipa ../
          else
            echo "Error: Runner.app not found! Build failed."
            exit 1
          fi
    artifacts:
      - AdminChat.ipa