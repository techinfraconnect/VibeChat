workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter Dependencies
        script: |
          cd admin_chat
          flutter pub get
      - name: Build Unsigned iOS App & Package IPA
        script: |
          cd admin_chat
          # Build unsigned for device using profile or default mode to bypass strict release signing checks
          flutter build ios --profile --no-codesign
          
          # Create Payload directory
          mkdir -p Payload
          
          # Copy the built app bundle into Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app Payload/
          else
            echo "Error: Runner.app not found!"
            exit 1
          fi
          
          # Zip it into a valid IPA file
          zip -r AdminChat.ipa Payload
          cp AdminChat.ipa ../
    artifacts:
      - AdminChat.ipa
      - admin_chat/*.ipa