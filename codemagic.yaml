workflows:
  admin-chat-ios-app:
    name: Admin Chat iOS (.app)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          cd admin_chat
          flutter pub get
      - name: Install Pods
        script: |
          cd admin_chat/ios
          pod install
      - name: Build iOS .app Bundle
        script: |
          cd admin_chat
          flutter build ios --simulator
    artifacts:
      - admin_chat/build/ios/iphonesimulator/*.app

  client-chat-ios-app:
    name: Client Chat iOS (.app)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          cd client_chat
          flutter pub get
      - name: Install Pods
        script: |
          cd client_chat/ios
          pod install
      - name: Build iOS .app Bundle
        script: |
          cd client_chat
          flutter build ios --simulator
    artifacts:
      - client_chat/build/ios/iphonesimulator/*.app