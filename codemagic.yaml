workflows:
  admin-chat-ios-ipa:
    name: Admin Chat iOS (Unsigned IPA)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          cd admin_chat
          flutter pub get
      - name: Install Pods
        script: |
          cd admin_chat/ios
          pod install
      - name: Build Unsigned IPA for Sideloadly
        script: |
          cd admin_chat
          
          # 1. Build for physical iOS device architectures without Apple Developer code signing
          flutter build ios --release --no-codesign
          
          # 2. Create the required Payload directory structure
          mkdir -p build/Payload
          
          # 3. Copy the compiled device Runner.app into the Payload folder
          cp -r build/ios/iphoneos/Runner.app build/Payload/
          
          # 4. Zip the Payload folder to create the final .ipa file
          cd build
          zip -q -r AdminChat.ipa Payload
    artifacts:
      - admin_chat/build/*.ipa

