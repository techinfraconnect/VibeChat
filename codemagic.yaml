workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Dependencies
        script: |
          cd admin_chat
          flutter pub get
      - name: The Two-Step Override Build & Package
        script: |
          cd admin_chat
          
          # STEP 1: Let Flutter setup the environment (ignore the signing crash)
          echo "Running standard Flutter build to setup environment..."
          flutter build ios --release --no-codesign || true
          
          # STEP 2: Use raw Xcodebuild and FORCE the output to a custom directory
          echo "Running raw Xcodebuild to compile real binary..."
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="${PWD}/build/RealOutput" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
            
          # STEP 3: Package the final output from the RealOutput folder
          cd ..
          if [ -d "ios/build/RealOutput/Runner.app" ]; then
            mkdir -p Payload
            cp -r ios/build/RealOutput/Runner.app Payload/
            zip -r AdminChat.ipa Payload
            mv AdminChat.ipa ../
            echo "Successfully packaged full-size AdminChat.ipa!"
          else
            echo "Error: Fully compiled Runner.app not found! Build failed."
            exit 1
          fi
    artifacts:
      - AdminChat.ipa