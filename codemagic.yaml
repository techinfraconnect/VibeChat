workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Dependencies
        script: |
          cd admin_chat
          flutter pub get
      - name: Build Unsigned iOS App & Package IPA
        script: |
          cd admin_chat
          
          # 1. Run the standard Flutter build (this will now work because entitlements are removed)
          flutter build ios --release --no-codesign
          
          # 2. Package the IPA
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cd build/ios/iphoneos
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r AdminChat.ipa Payload
            mv AdminChat.ipa ../../../
            echo "Successfully packaged AdminChat.ipa!"
          else
            echo "Error: Runner.app not found! Build failed."
            exit 1
          fi
    artifacts:
      - admin_chat/AdminChat.ipa