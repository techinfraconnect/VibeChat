workflows:
  admin-chat-ios-unsigned:
    name: Admin Chat iOS (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter Packages
        script: |
          cd admin_chat
          flutter pub get
      - name: Build iOS App Unsigned
        script: |
          cd admin_chat
          flutter build ios --release --no-codesign
    artifacts:
      - admin_chat/build/ios/iphoneos/*.app

  client-chat-ios-unsigned:
    name: Client Chat iOS (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter Packages
        script: |
          cd client_chat
          flutter pub get
      - name: Build iOS App Unsigned
        script: |
          cd client_chat
          flutter build ios --release --no-codesign
    artifacts:
      - client_chat/build/ios/iphoneos/*.app